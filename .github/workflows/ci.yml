# PR/push CI: typecheck, lint and the unit tests on every change, plus the cross-repo
# integration suite — the app's real pairing and upload code against a real pulsevault server —
# so the wire contract both repos share is checked on every PR, not just on developer machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx jest --ci

  # The same suite against two servers:
  # - pinned: the pulsevault commit this app pins in its submodule (what it was built against);
  # - npm-latest: the latest pulsevault release on npm (what deployments are running).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [pinned, npm-latest]
    name: integration (${{ matrix.server }} pulsevault)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.server == 'pinned' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the pinned pulsevault
        if: matrix.server == 'pinned'
        working-directory: pulsevault-mieweb
        run: |
          npm ci
          npm run build
      - name: Install the latest pulsevault release
        if: matrix.server == 'npm-latest'
        run: |
          npm install --prefix "$RUNNER_TEMP/pv" --no-save --no-audit --no-fund @mieweb/pulsevault@latest
          echo "PV_CORE=$RUNNER_TEMP/pv/node_modules/@mieweb/pulsevault/dist/core.js" >> "$GITHUB_ENV"
          npm view @mieweb/pulsevault version
      - name: Integration suite (real server, real wire)
        run: PULSE_INTEGRATION=1 npx jest pv-integration --ci --forceExit
