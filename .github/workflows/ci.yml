# PR/push CI: typecheck, lint and the unit tests on every change, the embed bundle check, plus the
# cross-repo integration suite — the app's real pairing and upload code against a real pulsevault
# server — so the wire contract both repos share is checked on every PR, not just on developer
# machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # the protocol schemas the app's types are generated from
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Protocol types match the pinned protocol and package.json
        run: node scripts/gen-protocol-types.mjs --check
      - name: Unit tests
        run: npx jest --ci

  # What ships in PulseKit (the embed plan's B5): the embed's iOS and Android JS bundles hold
  # nothing from the standalone shell or an excluded package, every native dependency is
  # classified in embed/deps.json, the facade and plugins never open SQLite, and the facade keeps
  # the names hosts call. JS bundling only, no native build; `npm run check:embed` runs it locally.
  embed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # modules/pulse-editor: the embed bundles it from source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Embed bundle check
        run: npm run check:embed

  # PulseKit's Android core (embed/native/android, plain Kotlin) against the shared vectors the
  # Swift runners and jest check, plus the upload service's rules: a JVM-only Gradle build with no
  # Android Gradle Plugin and no expo (embed/native/android/README.md). No Android build on PRs.
  jvm-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14' # jvm-tests has no wrapper; 8.14 is the Gradle of the local runs
      - name: Shared vectors (envelope, catalog, namespace, Kotlin-only)
        run: gradle -p embed/native/android/jvm-tests run --args="$GITHUB_WORKSPACE"
      - name: Upload service rules
        run: |
          gradle -p embed/native/android/jvm-tests run \
            -PmainClass=com.mieweb.pulse.kit.vectors.UploadRulesMain --args="$GITHUB_WORKSPACE"

  # The same suite against two servers:
  # - pinned: the pulsevault commit this app pins in its submodule (what it was built against);
  # - npm-latest: the latest pulsevault release on npm (what deployments are running).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [pinned, npm-latest]
    name: integration (${{ matrix.server }} pulsevault)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.server == 'pinned' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the pinned pulsevault
        if: matrix.server == 'pinned'
        working-directory: pulsevault-mieweb
        run: |
          npm ci
          npm run build
      - name: Install the latest pulsevault release
        if: matrix.server == 'npm-latest'
        run: |
          npm install --prefix "$RUNNER_TEMP/pv" --no-save --no-audit --no-fund @mieweb/pulsevault@latest
          echo "PV_CORE=$RUNNER_TEMP/pv/node_modules/@mieweb/pulsevault/dist/core.js" >> "$GITHUB_ENV"
          npm view @mieweb/pulsevault version
      - name: Integration suite (real server, real wire)
        run: PULSE_INTEGRATION=1 npx jest pv-integration --ci --forceExit
