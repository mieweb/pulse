# ─────────────────────────────────────────────────────────────────────────────
# iOS Expo Build & Upload
#
# Composes mieweb/actions building blocks (pinned to v2.3.0):
#   prepare-expo-env → stamp build number → expo prebuild
#   → sign-archive-upload-ios (match) → upload to TestFlight
#
# Signing mode: match
#   The distribution certificate and the App Store profile for com.mieweb.pulse
#   live in the org's private fastlane match repo. CI fetches them read-only;
#   nothing app-specific is stored here beyond the six secrets below.
#
# Required repo secrets (same names as mieweb_auth_app):
#   APPLE_TEAM_ID                  Apple Developer Team ID (= X5873NL7XM)
#   APPLE_API_KEY_ID               App Store Connect API key ID (TestFlight upload)
#   APPLE_API_ISSUER_ID            App Store Connect issuer ID
#   APPLE_API_KEY_P8_BASE64        base64 of the .p8 API key
#   MATCH_GIT_BASIC_AUTHORIZATION  base64 user:token for the match signing repo
#   MATCH_PASSWORD                 passphrase that decrypts the match repo
# ─────────────────────────────────────────────────────────────────────────────
name: iOS Expo Build & Upload

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      # ── Checkout, Xcode, Node, JS deps ────────────────────────────────────
      - name: Setup Expo environment
        uses: mieweb/actions/prepare-expo-env@360fec8818c88cc06f1e3a997b227daba34aa1a3 # v2.3.0
        with:
          package_manager: npm
          node_version: "20"

      # ── Give every CI build a unique, increasing build number ─────────────
      - name: Stamp build number
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.ios=j.expo.ios||{};j.expo.ios.buildNumber=String(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync('app.json',JSON.stringify(j,null,2));console.log('iOS buildNumber =',j.expo.ios.buildNumber);"

      # ── Regenerate native ios/ from app.json ──────────────────────────────
      - name: Expo prebuild (ios)
        run: npx expo prebuild --clean --platform ios --non-interactive

      # ── Use a distribution identity for the archive ───────────────────────
      # expo prebuild writes CODE_SIGN_IDENTITY = "iPhone Developer". The
      # signing action switches the project to manual signing with the match
      # App Store profile but leaves the identity alone, so a Release archive
      # would look for a development cert and fail. "iPhone Distribution" is
      # the generic identity Xcode resolves to either an "iPhone Distribution"
      # or an "Apple Distribution" certificate, whichever match provides.
      - name: Use distribution signing identity
        run: |
          PBX=$(ls ios/*.xcodeproj/project.pbxproj 2>/dev/null | head -1)
          if [ -z "$PBX" ]; then
            echo "::error::no ios/*.xcodeproj/project.pbxproj found after expo prebuild"
            exit 1
          fi
          # Only touch CODE_SIGN_IDENTITY lines (plain or [sdk=iphoneos*] form).
          # Expo templates have written either "iPhone Developer" or "Apple Development".
          sed -i '' -E '/CODE_SIGN_IDENTITY/ s/"(iPhone Developer|Apple Development)"/"iPhone Distribution"/' "$PBX"
          grep -n "CODE_SIGN_IDENTITY" "$PBX" || echo "::warning::no CODE_SIGN_IDENTITY entries found in $PBX"

      # ── pod install + sign + archive + upload ─────────────────────────────
      - name: Build & upload iOS to TestFlight
        uses: mieweb/actions/sign-archive-upload-ios@360fec8818c88cc06f1e3a997b227daba34aa1a3 # v2.3.0
        with:
          signing_mode:                  match
          app_identifier:                com.mieweb.pulse
          apple_team_id:                 ${{ secrets.APPLE_TEAM_ID }}
          match_git_basic_authorization: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          match_password:                ${{ secrets.MATCH_PASSWORD }}
          apple_api_key_id:              ${{ secrets.APPLE_API_KEY_ID }}
          apple_api_issuer_id:           ${{ secrets.APPLE_API_ISSUER_ID }}
          apple_api_key_p8_base64:       ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          ios_build_dir:                 ios
          run_pod_install:               "true"
          upload_to_testflight:          ${{ inputs.upload_to_testflight }}
