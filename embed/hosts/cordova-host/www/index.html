<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pulse host test</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 16px;
        background: #fff;
        color: #111;
      }
      button {
        font-size: 17px;
        min-height: 44px;
        padding: 8px 12px;
        margin: 0 8px 8px 0;
      }
      pre {
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Host</h1>
    <div>
      <button data-action="info">Info</button>
      <button data-action="configure">Configure</button>
      <button data-action="prewarm">Prewarm</button>
      <button data-action="record">Record</button>
      <button data-action="isOpen">Is open</button>
      <button data-action="close">Close</button>
      <button data-action="pending">Pending</button>
      <button data-action="ackAll">Acknowledge all</button>
      <button data-action="logFile">Log file</button>
      <button data-action="unknown">Unknown method</button>
      <button data-action="reload">Reload page</button>
    </div>
    <pre id="log"></pre>
    <script src="cordova.js"></script>
    <script src="host.js"></script>
  </body>
</html>
