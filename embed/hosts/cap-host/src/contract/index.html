<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pulse contract</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 16px;
        background: #fff;
        color: #111;
      }
      button {
        font-size: 17px;
        min-height: 44px;
        padding: 8px 12px;
        margin: 0 8px 8px 0;
      }
      #steps {
        white-space: pre-wrap;
        font-size: 15px;
      }
      ul {
        padding-left: 18px;
        font-size: 12px;
      }
      .ok {
        color: #0a7a2f;
      }
      .fail {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Pulse contract</h1>
    <p><a href="../index.html">Back to the host page</a></p>
    <button id="start">Run the contract suite</button>
    <button id="go" disabled>Go</button>
    <p id="steps" aria-live="polite"></p>
    <ul id="results" aria-live="polite"></ul>
    <script src="contract.js"></script>
  </body>
</html>
